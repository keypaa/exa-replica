[project]
name = "exa-replica"
version = "0.0.0"
description = "Open-source, self-hosted Exa-type search replica (MCP + HTTP)."
license = { text = "Apache-2.0" }
authors = [{ name = "Keylhan Paumard--Andre" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.165,<1",
  "uvicorn",
  "mcp>=2,<3",
  "pydantic",
  "pydantic-settings",
  "trafilatura",
  "pyarrow",
  "numpy",
  "msgpack",
]

[tool.exa-replica]
# MCP spec revision targeted at M0 freeze (D89 amended). Serving must not
# depend on a server-initiated request (elicitation/sampling/roots removed).
mcp_target_revision = "2026-07-28"

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "import-linter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exa_replica"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:SOCKS support in urllib3",
]

[tool.mypy]
strict = true
files = ["src/exa_replica"]

[[tool.mypy.overrides]]
module = "resiliparse.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "glotlid.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgpack.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["zenno"]

[tool.coverage.run]
source = ["src/exa_replica/domain", "src/exa_replica/application"]