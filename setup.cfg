[importlinter]
root_packages =
    exa_replica
include_external_packages = True

[importlinter:contract:layers]
name = Layered architecture (D96, down-only)
type = layers
layers =
    exa_replica.entrypoints
    exa_replica.bootstrap
    exa_replica.adapters
    exa_replica.application
    exa_replica.ports
    exa_replica.domain

[importlinter:contract:forbidden-entrypoints-adapters]
name = Entrypoints must not import adapters directly (D96)
type = forbidden
allow_indirect_imports = True
source_modules =
    exa_replica.entrypoints
forbidden_modules =
    exa_replica.adapters

[importlinter:contract:forbidden-domain-externals]
name = Domain/application must not import web/ML frameworks (D96)
type = forbidden
source_modules =
    exa_replica.domain
    exa_replica.application
forbidden_modules =
    fastapi
    httpx
    torch

[importlinter:contract:independence-adapters]
name = Adapters inbound/outbound are independent (D96)
type = independence
modules =
    exa_replica.adapters.inbound
    exa_replica.adapters.outbound